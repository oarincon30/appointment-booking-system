# src/main/resources/application.yml
spring:
  datasource:
    url: jdbc:postgresql://<tu-servidor>.postgres.database.azure.com:5432/dental_dev?sslmode=require
    username: <dental_user>
    password: ${DB_PASSWORD}          # define DB_PASSWORD en tu entorno local
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update                 # dev only
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace